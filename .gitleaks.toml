[extend]
# Enable default gitleaks rules
useDefault = true

[[allowlists]]
description = "Allow placeholder Mongo URIs in .env.example"
# Both the example path and the complete placeholder URI must match.
condition = "AND"
paths = ['''(^|[\\/])\.env\.example$''']
regexTarget = "match"
regexes = ['''^mongodb\+srv://<user>:<pass>@<cluster>/[^\s]+$''']
