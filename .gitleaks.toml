title = "News Pulse Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow the placeholder MongoDB URI in .env.example"
condition = "AND"
paths = ['''^\.env\.example$''']
regexTarget = "line"
regexes = [
  '''^\s*#\s*MONGODB_URI=mongodb\+srv://(?i:user):(?i:pass)@(?i:cluster)/newspulse_dev\?retryWrites=true&w=majority\s*$''',
]
